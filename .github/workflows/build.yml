name: Build BE211 kext

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: be211-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check source and published package integrity
        run: |
          sha256sum -c SHA256SUMS
          python3 -c "import ast, pathlib; [ast.parse(p.read_text()) for p in [*pathlib.Path('source').glob('*.py'), *pathlib.Path('tools').glob('*.py')]]"
          sh -n tools/capture-safari.sh
          bash -n tools/build-linker.sh
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 build-essential automake autoconf libtool libblocksruntime-dev uuid-dev
          mkdir -p "$RUNNER_TEMP/ci-bin"
          ln -s /usr/bin/clang-18 "$RUNNER_TEMP/ci-bin/clang"
          ln -s /usr/bin/clang++-18 "$RUNNER_TEMP/ci-bin/clang++"
          ln -s /usr/bin/llvm-nm-18 "$RUNNER_TEMP/ci-bin/llvm-nm"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - name: Restore ld64
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ld64
          key: ld64-ubuntu24-clang18-9fc3e04656050ddc-${{ hashFiles('tools/build-linker.sh') }}
      - name: Build pinned ld64
        run: bash tools/build-linker.sh "$RUNNER_TEMP/ld64" "$RUNNER_TEMP/cctools-port"
      - name: Extract the matching source
        run: |
          mkdir -p "$RUNNER_TEMP/driver"
          tar -xzf source/AirportItlwm-BE211-attempt-101-source.tar.gz -C "$RUNNER_TEMP/driver"
          echo "253876486e3b45267c9b67b510b90b2a6dc67e7d9b51ef4b367bf4813db693d3  $RUNNER_TEMP/driver/itlwm/firmware/iwlwifi-sc-a0-wh-b0-c106.ucode" | sha256sum -c
      - name: Cross-build the Sequoia kext
        run: python3 source/build.py "$RUNNER_TEMP/driver" "$RUNNER_TEMP/output" "$RUNNER_TEMP/ld64/bin/x86_64-apple-darwin-ld"
      - name: Validate and package
        run: python3 tools/package-ci.py "$RUNNER_TEMP/output/AirportItlwm.kext" dist
      - name: Upload build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: BE211-Sequoia-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload compiler logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: BE211-build-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/output/objects/*.log
            ${{ runner.temp }}/cctools-port/cctools/config.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Draft tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: BE211-Sequoia-${{ github.sha }}
          path: dist
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease               --title "$RELEASE_TAG" --notes "Developer preview built by CI. See build-info.json for the source commit, validation and hardware test status."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
